name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        env:
          PYTHONPATH: backend
        run: python -m compileall -q backend/app backend/tests backend/migrations

      - name: Validate Alembic migration generation
        env:
          PYTHONPATH: .
        run: |
          cd backend
          python -m alembic upgrade --sql head

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
